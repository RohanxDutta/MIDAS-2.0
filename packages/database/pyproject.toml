[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-database"
version = "1.0.0"
description = "Shared SQLModel schemas and database configurations for MIDAS 2.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "sqlmodel>=0.0.19",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1"
]
