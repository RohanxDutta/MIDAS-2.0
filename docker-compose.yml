name: midas-20

services:
  # Local Redis draft cache instance
  redis:
    image: redis:7-alpine
    container_name: midas_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # FastAPI Backend Service (With Live Sync & Root Context)
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: midas_backend
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/database:/app/packages/database
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    depends_on:
      - redis
    restart: always

  # Next.js Frontend Service (With Live Sync & Root Context)
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: midas_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - api
    restart: always

volumes:
  redis_data:
